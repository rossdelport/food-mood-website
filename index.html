document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 height: 2px; border-radius: 2px; background: var(--ink-1); margin: 0 auto; transition: transform .3s ease, opacity .2s ease; }\n  .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }\n  .hamburger.open span:nth-child(2) { opacity: 0; }\n  .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }\n  .mobile-menu { display: none; flex-direction: column; gap: 4px; padding: 8px 24px 22px; background: rgba(250,248,244,0.96); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }\n  .mobile-menu a { font-size: 16px; color: var(--ink-2); padding: 13px 4px; border-bottom: 1px solid var(--line); }\n  .mobile-menu a:last-child { border-bottom: none; }\n  .mobile-menu .mm-cta { color: #F3EFE9; text-align: center; margin-top: 12px; padding: 15px 0; border-bottom: none; }\n  .nav.menu-open .mobile-menu { display: flex; animation: menuDrop .28s ease; }\n  @keyframes menuDrop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }\n  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; font-size: 14.5px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: transform .2s ease, box-shadow .2s ease, background .2s; border: none; }\n  .btn-dark { background: var(--accent); color: #F3EFE9; padding: 12px 22px; box-shadow: 0 8px 20px rgba(31,39,51,0.18); }\n  .btn-dark:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(31,39,51,0.26); }\n  .btn-ghost { background: transparent; color: var(--ink-2); padding: 12px 18px; }\n  .btn-ghost:hover { color: var(--ink-1); }\n  .btn-lg { padding: 16px 30px; font-size: 16px; border-radius: 14px; }\n\n  /* store badges */\n  .badges { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }\n  .store-badge { display: inline-flex; align-items: center; gap: 11px; background: var(--accent); color: #F3EFE9; border-radius: 13px; paddi ; background: var(--card); border-radius: 44px; box-shadow: 0 50px 90px rgba(40,30,20,0.18), 0 0 0 1px rgba(0,0,0,0.04); padding: 16px; z-index: 2; animation: bob 7s ease-in-out infinite; }\n  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1.2deg); } 50% { transform: translateY(-16px) rotate(-1.2deg); } }\n  .app-shot { position: relative; width: min(296px, 76vw); z-index: 2; display: block; animation: bob 7s ease-in-out infinite; filter: drop-shadow(0 44px 60px rgba(40,30,20,0.22)); }\n  .phone-screen { width: 100%; height: 100%; background: var(--bg); border-radius: 30px; overflow: hidden; padding: 28px 20px; }\n  .ps-eyebrow { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }\n  .ps-date { font-size: 22px; font-weight: 300; margin-top: 6px; letter-spacing: -0.4px; }\n  .ps-spectrum { height: 42px; border-radius: 10px; margin-top: 14px; }\n  .ps-row { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 9px 10px; margin-top: 10px; }\n  .ps-dot { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 4px 8px rgba(255,255,255,0.4); }\n  .ps-lines { flex: 1; }\n  .ps-lines i { display: block; height: 6px; border-radius: 4px; background: var(--chip); }\n  .ps-lines i:last-child { width: 55%; margin-top: 6px; }\n\n  /* floating orbs */\n  .orb { position: absolute; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05), inset 0 8px 16px rgba(255,255,255,0.4), 0 14px 30px rgba(0,0,0,0.10); z-index: 1; cursor: pointer; transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease; }\n  .orb:hover { transform: scale(1.22); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05), inset 0 8px 16px rgba(255,255,255,0.45), 0 16px 36px var(--glow, rgba(0,0,0,0.14)); }\n  @keyframes breathe { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-18px) scale(1.07); } }\n  @media (prefers-reduced-motion: reduce) {\n    .flow, .phone, .orb { animation: none !important; }\n  }\n\n  /* ── generic section ── */\n  section { position: relative; }\n  .band { background: var(--bg-2); }\n  .pad { padding: 92px 0; }\n  .center { text-align: center; }\n  .kicker { font-size: 12px; letter-spacing: 2.6px; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }\n  h2 { font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: clamp(32px, 4vw, 46px); line-height: 1.1; letter-spacing: -0.6px; margin-top: 14px; }\n  .sub { font-size: 17px; line-height: 1.6; color: var(--ink-2); margin-top: 16px; }\n  .center .sub { margin-left: auto; margin-right: auto; max-width: 600px; }\n\n  /* tagline strip */\n  .strip { display: flex; justify-content: center; gap: 48px; flex-wrap: wrap; padding: 40px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }\n  .strip .item { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 300; letter-spacing: -0.3px; }\n  .strip .item .d { width: 13px; height: 13px; border-radius: 50%; }\n  .strip .item b { font-weight: 500; }\n\n  /* who-for */\n  .for-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: center; }\n  .for-list { list-style: none; margin-top: 24px; }\n  .for-list li { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid var(--line); font-size: 16.5px; color: var(--ink-1); }\n  .for-list li:first-child { border-top: none; }\n  .for-list .d { width: 13px; height: 13px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }\n  .for-card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 36px; box-shadow: 0 30px 60px rgba(40,30,20,0.06); }\n  .for-quote { font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 24px; line-height: 1.5; color: var(--ink-1); }\n  .for-by { margin-top: 20px; font-size: 14px; color: var(--ink-3); }\n\n  /* steps */\n  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 56px; }\n  .step { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 30px; position: relative; transition: transform .25s ease, box-shadow .25s ease; }\n  .step:hover { transform: translateY(-6px); box-shadow: 0 24px 50px rgba(40,30,20,0.08); }\n  .step .ic { width: 54px; height: 54px; border-radius: 16px; background: var(--chip); display: flex; align-items: center; justify-content: center; }\n  .step h3 { font-size: 19px; font-weight: 500; margin-top: 20px; }\n  .step p { font-size: 15px; line-height: 1.55; color: var(--ink-2); margin-top: 8px; }\n  .step .n { position: absolute; top: 24px; right: 26px; font-size: 13px; color: var(--ink-3); font-weight: 600; }\n\n  /* features */\n  .feat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 52px; }\n  .feat { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px; transition: transform .25s ease, box-shadow .25s ease; }\n  .feat:hover { transform: translateY(-5px); box-shadow: 0 22px 46px rgba(40,30,20,0.07); }\n  .feat .d { width: 16px; height: 16px; border-radius: 50%; }\n  .feat h3 { font-size: 18px; font-weight: 500; margin-top: 18px; }\n  .feat p { font-size: 14.5px; line-height: 1.55; color: var(--ink-2); margin-top: 7px; }\n\n  /* moods */\n  .moods-row { display: flex; justify-content: center; gap: 38px; flex-wrap: wrap; margin-top: 56px; }\n  .mood-col { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 150px; }\n  .mood-orb { width: 92px; height: 92px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05), inset 0 10px 20px rgba(255,255,255,0.45), 0 16px 30px rgba(0,0,0,0.08); animation: breathe 6s ease-in-out infinite; cursor: pointer; transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s ease; }\n  .mood-col:hover .mood-orb { transform: scale(1.12); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05), inset 0 10px 20px rgba(255,255,255,0.5), 0 18px 36px var(--glow, rgba(0,0,0,0.12)); }\n  .mood-col:hover .mood-name { color: var(--c, var(--ink-1)); transition: color .3s ease; }\n  .mood-name { font-size: 17px; font-weight: 500; }\n  .mood-sub { font-size: 12.5px; color: var(--ink-3); margin-top: -8px; }\n\n  /* big quote */\n  .quote { text-align: center; }\n  .quote p { font-family: 'Newsreader', Georgia, serif; font-size: clamp(28px, 3.6vw, 40px); line-height: 1.35; letter-spacing: -0.4px; max-width: 860px; margin: 0 auto; }\n\n  /* cta */\n  .cta { text-align: center; }\n  .cta-card { background: var(--accent); border-radius: 32px; padding: 72px 40px; color: #F3EFE9; position: relative; overflow: hidden; }\n  .cta-card h2 { color: #F8F4ED; }\n  .cta-card .sub { color: rgba(248,244,237,0.72); }\n  .cta-form { display: flex; gap: 10px; max-width: 440px; margin: 34px auto 0; }\n  .cta-form input { flex: 1; border: none; border-radius: 12px; padding: 16px 18px; font-size: 15px; font-family: inherit; background: rgba(255,255,255,0.12); color: #F8F4ED; outline: none; }\n  .cta-form input::placeholder { color: rgba(248,244,237,0.5); }\n  .cta-form .btn { background: #F3EFE9; color: var(--accent); }\n  .cta-spectrum { height: 10px; width: 280px; border-radius: 999px; margin: 0 auto 26px; opacity: 0.95; }\n\n  /* footer */\n  footer { padding: 48px 0; border-top: 1px solid var(--line); }\n  .foot-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 18px; }\n  .foot-links { display: flex; gap: 26px; }\n  .foot-links a { font-size: 13.5px; color: var(--ink-3); }\n  .foot-links a:hover { color: var(--ink-1); }\n  .copy { font-size: 13px; color: var(--ink-3); }\n\n  /* scroll reveal — visible by default; hiding only applies once JS opts in,\n     so content is never trapped if the observer never fires */\n  .reveal { opacity: 1; transform: none; }\n  body.reveal-anim .reveal { opacity: 0; transform: translateY(24px); transition: opacity .8s cubic-bezier(.22,.61,.36,1), transform .8s cubic-bezier(.22,.61,.36,1); }\n  body.reveal-anim .reveal.in { opacity: 1; transform: none; }\n  @media (prefers-reduced-motion: reduce) { body.reveal-anim .reveal { opacity: 1; transform: none; transition: none; } }\n\n  /* ── responsive ── */\n  @media (max-width: 880px) {\n    .for-grid { grid-template-columns: 1fr; }\n    /* dissolve the 2-col grid so hero children stack in a controlled order */\n    .hero-inner { display: flex; flex-direction: column; align-items: stretch; gap: 0; }\n    .hero-copy { display: contents; }\n    .eyebrow { order: 1; }\n    .hero-title { order: 2; }\n    .lead { order: 3; max-width: none; }\n    /* keep the visual's section footprint, just shrink the device inside it */\n    .hero-visual { order: 4; min-height: 420px; padding: 8px 0 4px; }\n    .hero-copy .badges { order: 5; margin-top: 30px; }\n    .spectrum-bar { order: 6; max-width: none; }\n    .steps, .feat-grid { grid-template-columns: 1fr 1fr; }\n    .links, .nav-cta { display: none; }\n    .hamburger { display: flex; }\n    .pad { padding: 72px 0; }\n    .hero { padding: 48px 0 72px; }\n    .app-shot { width: min(224px, 53vw); }\n  }\n  @media (max-width: 600px) {\n    .container { padding: 0 22px; }\n    .nav-inner { height: 64px; }\n    .pad { padding: 56px 0; }\n    .hero { padding: 36px 0 52px; }\n    .hero-visual { min-height: 380px; }\n    .app-shot { width: min(198px, 50vw); }\n    h1.hero-title { font-size: clamp(40px, 11vw, 56px); }\n    .lead { font-size: 16.5px; }\n    .steps, .feat-grid { grid-template-columns: 1fr; gap: 14px; margin-top: 36px; }\n    .step, .feat { padding: 24px; border-radius: 18px; }\n    .strip { gap: 18px 30px; padding: 30px 0; }\n    .strip .item { font-size: 18px; }\n    .for-card { padding: 28px; }\n    .for-quote { font-size: 21px; }\n    .moods-row { gap: 26px 30px; margin-top: 40px; }\n    .mood-col { width: 116px; }\n    .mood-orb { width: 78px; height: 78px; }\n    .cta-card { padding: 52px 26px; border-radius: 26px; }\n    .cta-form { flex-direction: column; }\n    .cta-form .btn { width: 100%; }\n    .badges { gap: 10px; }\n    .foot-inner { flex-direction: column; text-align: center; gap: 22px; }\n    .foot-links { flex-wrap: wrap; justify-content: center; gap: 16px 22px; }\n  }\n  @media (max-width: 380px) {\n    .badges { width: 100%; }\n    .store-badge { flex: 1; justify-content: center; }\n    .hero .badges { flex-direction: column; }\n    .hero .store-badge { width: 100%; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- NAV -->\n<header class=\"nav\">\n  <div class=\"container nav-inner\">\n    <div class=\"brand\">\n      <span class=\"logo\" id=\"logo\"><\u002Fspan> Food Mood\n    <\u002Fdiv>\n    <nav class=\"links\">\n      <a href=\"#how\">How it works<\u002Fa>\n      <a href=\"#moods\">Moods<\u002Fa>\n      <a href=\"#features\">Features<\u002Fa>\n    <\u002Fnav>\n    <a class=\"btn btn-dark nav-cta\">Get the app<\u002Fa>\n    <button class=\"hamburger\" id=\"hamburger\" aria-label=\"Open menu\" aria-expanded=\"false\">\n      <span><\u002Fspan><span><\u002Fspan><span><\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"mobile-menu\" id=\"mobileMenu\">\n    <a href=\"#how\">How it works<\u002Fa>\n    <a href=\"#moods\">Moods<\u002Fa>\n    <a href=\"#features\">Features<\u002Fa>\n    <a class=\"btn btn-dark mm-cta\">Get the app<\u002Fa>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- HERO -->\n<section class=\"hero\">\n  <div class=\"container hero-inner\">\n    <div class=\"hero-copy reveal\">\n      <div class=\"eyebrow\">Mood + macro tracking<\u002Fdiv>\n      <h1 class=\"hero-title\">How does food<br>make you feel?<\u002Fh1>\n      <p class=\"lead\">Food Mood is a calm, soulful way to notice the link between what you eat and how you feel. No calorie obsession, no guilt. Just your patterns, in colour.<\u002Fp>\n      <div class=\"badges\">\n        <a class=\"store-badge\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M17.05 12.7c-.03-2.5 2.04-3.7 2.13-3.76-1.16-1.7-2.97-1.93-3.61-1.96-1.54-.16-3 .9-3.78.9-.78 0-1.98-.88-3.25-.86-1.67.02-3.21.97-4.07 2.47-1.73 3-.44 7.45 1.25 9.88.83 1.19 1.81 2.53 3.1 2.48 1.24-.05 1.71-.8 3.21-.8 1.5 0 1.92.8 3.23.78 1.33-.02 2.18-1.21 3-2.41.94-1.38 1.33-2.72 1.35-2.79-.03-.01-2.59-.99-2.62-3.94zM14.6 4.84c.69-.83 1.15-1.99 1.02-3.14-.99.04-2.19.66-2.9 1.49-.64.73-1.2 1.91-1.05 3.04 1.1.08 2.24-.56 2.93-1.39z\"><\u002Fpath><\u002Fsvg>\n          <span class=\"sb-txt\"><small>Download on the<\u002Fsmall><b>App Store<\u002Fb><\u002Fspan>\n        <\u002Fa>\n        <a class=\"store-badge\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M5 3.5v17a1 1 0 001.5.87l14-8.5a1 1 0 000-1.74L6.5 2.63A1 1 0 005 3.5z\"><\u002Fpath><\u002Fsvg>\n          <span class=\"sb-txt\"><small>Get it on<\u002Fsmall><b>Google Play<\u002Fb><\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n      <div class=\"spectrum-bar flow\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hero-visual\">\n      <img class=\"app-shot\" src=\"a8b0e7ee-fd54-4b7b-80c6-fcb710083f09\" alt=\"The Food Mood app home screen\">\n      <!-- floating orbs (filled by JS) -->\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- TAGLINE STRIP -->\n<div class=\"container\">\n  <div class=\"strip reveal\">\n    <div class=\"item\"><span class=\"d\" style=\"background:var(--calm)\"><\u002Fspan>Mood <b>first.<\u002Fb><\u002Fdiv>\n    <div class=\"item\"><span class=\"d\" style=\"background:var(--focused)\"><\u002Fspan>Macros <b>second.<\u002Fb><\u002Fdiv>\n    <div class=\"item\"><span class=\"d\" style=\"background:var(--energetic)\"><\u002Fspan>Calories <b>optional.<\u002Fb><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- WHO IT'S FOR -->\n<section class=\"pad\">\n  <div class=\"container for-grid\">\n    <div class=\"reveal\">\n      <div class=\"kicker\">Who it’s for<\u002Fdiv>\n      <h2>For people who feel<br>food is more than fuel.<\u002Fh2>\n      <p class=\"sub\">If diet apps have only ever made you feel like a number, this is the gentle opposite. Food Mood is for noticing, not policing.<\u002Fp>\n      <ul class=\"for-list\">\n        <li><span class=\"d\" style=\"background:var(--energetic)\"><\u002Fspan>You want to understand your patterns, not punish yourself.<\u002Fli>\n        <li><span class=\"d\" style=\"background:var(--calm)\"><\u002Fspan>You’re done with calorie guilt and streak anxiety.<\u002Fli>\n        <li><span class=\"d\" style=\"background:var(--focused)\"><\u002Fspan>You believe how a meal leaves you feeling matters as much as the macros.<\u002Fli>\n        <li><span class=\"d\" style=\"background:var(--bloated)\"><\u002Fspan>You want a tracker that feels like a journal, not a spreadsheet.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"for-card reveal\">\n      <p class=\"for-quote\">“I stopped counting calories and started noticing how I actually felt. Turns out my best days were never the lowest-number ones.”<\u002Fp>\n      <div class=\"for-by\">— Maya, six weeks in<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- HOW IT WORKS -->\n<section id=\"how\" class=\"pad band\">\n  <div class=\"container center\">\n    <div class=\"reveal\">\n      <div class=\"kicker\">How it works<\u002Fdiv>\n      <h2>Three taps to a clearer week.<\u002Fh2>\n      <p class=\"sub\">No food diaries to dread. Logging a meal takes seconds, and the insight builds itself.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"steps\">\n      <div class=\"step reveal\">\n        <span class=\"n\">01<\u002Fspan>\n        <div class=\"ic\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\"><circle cx=\"12\" cy=\"13\" r=\"3.6\" stroke=\"#2A2622\" stroke-width=\"1.6\"><\u002Fcircle><path d=\"M5 8.5A1.5 1.5 0 016.5 7h1.4l.9-1.4a1 1 0 01.84-.46h4.7a1 1 0 01.84.46l.9 1.4h1.4A1.5 1.5 0 0119 8.5v8A1.5 1.5 0 0117.5 18h-11A1.5 1.5 0 015 16.5v-8z\" stroke=\"#2A2622\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <h3>Capture a meal<\u002Fh3>\n        <p>Snap a photo and Food Mood reads the macros for you. No weighing, no searching databases.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"step reveal\">\n        <span class=\"n\">02<\u002Fspan>\n        <div class=\"ic\"><span style=\"width:26px;height:26px;border-radius:50%;background:var(--calm);box-shadow:inset 0 4px 8px rgba(255,255,255,0.4)\"><\u002Fspan><\u002Fdiv>\n        <h3>Pick a feeling<\u002Fh3>\n        <p>Tap the colour that fits how the meal left you. Five moods, fully yours to rename and recolour.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"step reveal\">\n        <span class=\"n\">03<\u002Fspan>\n        <div class=\"ic\"><span style=\"width:30px;height:14px;border-radius:99px;background:var(--grad)\"><\u002Fspan><\u002Fdiv>\n        <h3>See the pattern<\u002Fh3>\n        <p>Your week unfolds as a flowing spectrum of colour, with reflections and a monthly mood calendar.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FEATURES -->\n<section id=\"features\" class=\"pad\">\n  <div class=\"container center\">\n    <div class=\"reveal\">\n      <div class=\"kicker\">What’s inside<\u002Fdiv>\n      <h2>Everything to notice,<br>nothing to police.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"feat-grid\">\n      <div class=\"feat reveal\"><span class=\"d\" style=\"background:var(--sluggish)\"><\u002Fspan><h3>7-day mood journey<\u002Fh3><p>A living gradient that shows your week’s feeling at a glance, not a grid of cold data points.<\u002Fp><\u002Fdiv>\n      <div class=\"feat reveal\"><span class=\"d\" style=\"background:var(--focused)\"><\u002Fspan><h3>Mood + macros<\u002Fh3><p>Protein, carbs and fat in a calm, readable breakdown. Calories are there only if you want them.<\u002Fp><\u002Fdiv>\n      <div class=\"feat reveal\"><span class=\"d\" style=\"background:var(--calm)\"><\u002Fspan><h3>A real journal<\u002Fh3><p>Free-form reflections grouped by week, tagged with the mood you felt. A space, not a form.<\u002Fp><\u002Fdiv>\n      <div class=\"feat reveal\"><span class=\"d\" style=\"background:var(--bloated)\"><\u002Fspan><h3>Monthly mood calendar<\u002Fh3><p>Every day painted with its dominant colour, so months of feeling become visible at a glance.<\u002Fp><\u002Fdiv>\n      <div class=\"feat reveal\"><span class=\"d\" style=\"background:var(--energetic)\"><\u002Fspan><h3>Gentle reminders<\u002Fh3><p>One soft nudge after a meal to capture how you feel. You choose the timing, never the guilt.<\u002Fp><\u002Fdiv>\n      <div class=\"feat reveal\"><span class=\"d\" style=\"background:var(--focused)\"><\u002Fspan><h3>Moods you own<\u002Fh3><p>Add, rename, recolour or remove feelings until the palette is unmistakably yours.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- MEET YOUR MOODS -->\n<section id=\"moods\" class=\"pad band\">\n  <div class=\"container center\">\n    <div class=\"reveal\">\n      <div class=\"kicker\">Meet your moods<\u002Fdiv>\n      <h2>Five feelings, five colours.<\u002Fh2>\n      <p class=\"sub\">The emotional anchor of the whole app. Tap one after each meal and watch the patterns appear.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"moods-row\" id=\"moodsRow\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- QUOTE -->\n<section class=\"pad\">\n  <div class=\"container quote reveal\">\n    <p class=\"serif\">Most trackers reduce food to numbers. Food Mood starts with a feeling, and lets the macros be the quiet story underneath.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CTA -->\n<section class=\"pad cta\">\n  <div class=\"container\">\n    <div class=\"cta-card reveal\">\n      <div class=\"cta-spectrum flow\"><\u002Fdiv>\n      <div class=\"kicker\" style=\"color:rgba(248,244,237,0.6)\">Start noticing<\u002Fdiv>\n      <h2>Your week, in colour.<\u002Fh2>\n      <p class=\"sub\">Join the early list and be the first to feel the difference. Free to start, calm by design.<\u002Fp>\n      <form class=\"cta-form\" onsubmit=\"return false\">\n        <input type=\"email\" placeholder=\"you@email.com\">\n        <button class=\"btn btn-lg\">Get early access<\u002Fbutton>\n      <\u002Fform>\n      <div class=\"badges\">\n        <a class=\"store-badge light\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M17.05 12.7c-.03-2.5 2.04-3.7 2.13-3.76-1.16-1.7-2.97-1.93-3.61-1.96-1.54-.16-3 .9-3.78.9-.78 0-1.98-.88-3.25-.86-1.67.02-3.21.97-4.07 2.47-1.73 3-.44 7.45 1.25 9.88.83 1.19 1.81 2.53 3.1 2.48 1.24-.05 1.71-.8 3.21-.8 1.5 0 1.92.8 3.23.78 1.33-.02 2.18-1.21 3-2.41.94-1.38 1.33-2.72 1.35-2.79-.03-.01-2.59-.99-2.62-3.94zM14.6 4.84c.69-.83 1.15-1.99 1.02-3.14-.99.04-2.19.66-2.9 1.49-.64.73-1.2 1.91-1.05 3.04 1.1.08 2.24-.56 2.93-1.39z\"><\u002Fpath><\u002Fsvg>\n          <span class=\"sb-txt\"><small>Download on the<\u002Fsmall><b>App Store<\u002Fb><\u002Fspan>\n        <\u002Fa>\n        <a class=\"store-badge light\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M5 3.5v17a1 1 0 001.5.87l14-8.5a1 1 0 000-1.74L6.5 2.63A1 1 0 005 3.5z\"><\u002Fpath><\u002Fsvg>\n          <span class=\"sb-txt\"><small>Get it on<\u002Fsmall><b>Google Play<\u002Fb><\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer>\n  <div class=\"container foot-inner\">\n    <div class=\"brand\"><span class=\"logo\" id=\"logo2\"><\u002Fspan> Food Mood<\u002Fdiv>\n    <div class=\"foot-links\">\n      <a href=\"#how\">How it works<\u002Fa>\n      <a href=\"#features\">Features<\u002Fa>\n      <a href=\"#moods\">Moods<\u002Fa>\n      <a href=\"#\">Privacy<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"copy\">© 2026 Food Mood<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  const MOODS = [\n    { id: 'energetic', label: 'Energetic', sub: 'excited, flowing', color: '#F4E4C1' },\n    { id: 'focused', label: 'Focused', sub: 'content, stable', color: '#C9A876' },\n    { id: 'calm', label: 'Calm', sub: 'grounded, peaceful', color: '#A8B8A0' },\n    { id: 'bloated', label: 'Bloated', sub: 'heavy, full', color: '#7A8FA3' },\n    { id: 'sluggish', label: 'Sluggish', sub: 'low energy', color: '#8B4F5C' },\n  ];\n\n  // logo dots\n  function hexToGlow(hex) {\n    const n = hex.replace('#', '');\n    const r = parseInt(n.slice(0, 2), 16), g = parseInt(n.slice(2, 4), 16), b = parseInt(n.slice(4, 6), 16);\n    return `rgba(${r},${g},${b},0.55)`;\n  }\n  function paintLogo(el) {\n    if (!el) return;\n    MOODS.forEach(m => {\n      const s = document.createElement('span');\n      s.style.background = m.color;\n      el.appendChild(s);\n    });\n  }\n  paintLogo(document.getElementById('logo'));\n  paintLogo(document.getElementById('logo2'));\n\n  // mobile menu toggle\n  const nav = document.querySelector('.nav');\n  const burger = document.getElementById('hamburger');\n  const closeMenu = () => { nav.classList.remove('menu-open'); burger.classList.remove('open'); burger.setAttribute('aria-expanded', 'false'); };\n  burger.addEventListener('click', () => {\n    const open = nav.classList.toggle('menu-open');\n    burger.classList.toggle('open', open);\n    burger.setAttribute('aria-expanded', String(open));\n  });\n  document.querySelectorAll('#mobileMenu a').forEach(a => a.addEventListener('click', closeMenu));\n\n  // meet-your-moods row\n  const row = document.getElementById('moodsRow');\n  MOODS.forEach((m, i) => {\n    const col = document.createElement('div');\n    col.className = 'mood-col reveal';\n    col.style.setProperty('--c', m.color);\n    col.style.setProperty('--glow', hexToGlow(m.color));\n    col.innerHTML = `<div class=\"mood-orb\" style=\"background:${m.color}; animation-delay:${i * 0.6}s\"><\u002Fdiv>\n      <div class=\"mood-name\">${m.label}<\u002Fdiv><div class=\"mood-sub\">${m.sub}<\u002Fdiv>`;\n    row.appendChild(col);\n  });\n\n  // floating orbs around the hero phone\n  const visual = document.querySelector('.hero-visual');\n  const floaters = [\n    { c: '#F4E4C1', size: 64, top: '6%', left: '4%', dur: 7, delay: 0 },\n    { c: '#A8B8A0', size: 46, top: '20%', right: '2%', dur: 8.5, delay: 1.2 },\n    { c: '#8B4F5C', size: 38, bottom: '14%', left: '0%', dur: 9, delay: 0.5 },\n    { c: '#C9A876', size: 54, bottom: '6%', right: '8%', dur: 7.6, delay: 2 },\n    { c: '#7A8FA3', size: 30, top: '46%', left: '-2%', dur: 10, delay: 0.8 },\n  ];\n  floaters.forEach(f => {\n    const o = document.createElement('div');\n    o.className = 'orb';\n    o.style.background = f.c;\n    o.style.setProperty('--glow', hexToGlow(f.c));\n    o.style.width = o.style.height = f.size + 'px';\n    ['top', 'left', 'right', 'bottom'].forEach(p => { if (f[p] != null) o.style[p] = f[p]; });\n    o.style.animation = `breathe ${f.dur}s ease-in-out ${f.delay}s infinite`;\n    visual.appendChild(o);\n  });\n\n  // scroll reveal\n  document.body.classList.add('reveal-anim');\n  const io = new IntersectionObserver((entries) => {\n    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });\n  }, { threshold: 0.12 });\n  document.querySelectorAll('.reveal').forEach((el, i) => {\n    el.style.transitionDelay = (Math.min(i % 3, 2) * 0.08) + 's';\n    io.observe(el);\n  });\n  // safety net: if the observer never fires (e.g. non-rendered/offscreen frame),\n  // drop the gate AND hard-resolve every reveal so no frozen in-flight transition\n  // can keep an element stuck at its hidden start value.\n  setTimeout(() => {\n    const first = document.querySelector('.reveal');\n    if (first && !first.classList.contains('in')) {\n      document.body.classList.remove('reveal-anim');\n      document.querySelectorAll('.reveal').forEach(el => {\n        try { el.getAnimations().forEach(a => a.cancel()); } catch (e) {}\n        el.style.transition = 'none';\n        el.style.opacity = '1';\n        el.style.transform = 'none';\n        el.classList.add('in');\n      });\n    }\n  }, 2000);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
